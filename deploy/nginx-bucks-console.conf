# /etc/nginx/sites-available/bucks-console.conf (written by bootstrap-ubuntu.sh for the console role)
#
# TLS reverse proxy for the Bucks OPERATOR console (the web UI and REST API the node serves).
# The console is single-operator: one API token unlocks every wallet on the node and wallets.json
# holds the private keys. Keep it behind the IP allowlist AND basic auth below; it is not a public
# wallet site.
#
# Node flags this file relies on (roles/console.env):
#   --server --port 8080 --api-bind 127.0.0.1    API only on loopback; never open 8080 in the firewall
#   --api-allowed-host console.example.org       else every proxied request is 403 (unexpected Host)
#   --trust-proxy                                rate limit per client from X-Forwarded-For, and TLS from
#                                                X-Forwarded-Proto; believed only from loopback
#   --api-secure-cookie                          Secure session cookie, https origins only
# Not needed: --api-cors-origin (UI and API are the same origin, served on 443).
#
# Works with nginx 1.18 (Ubuntu 22.04) and 1.24 (Ubuntu 24.04). On a host booted with IPv6 disabled,
# delete the "listen [::]" lines or nginx will not start.

limit_req_zone $binary_remote_addr zone=bucks_login:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=bucks_api:10m rate=10r/s;

upstream bucks_node {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name console.example.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name console.example.org;

    ssl_certificate     /etc/letsencrypt/live/console.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:bucks_tls:10m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 1m;          # the node refuses bodies over 1 MiB anyway
    client_body_timeout 10s;
    client_header_timeout 10s;

    # The node sends CSP, X-Frame-Options, nosniff and Referrer-Policy itself.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Operator access only: both the network allowlist and the password must pass.
    satisfy all;
    allow 203.0.113.4/32;             # BUCKS_ADMIN_CIDR (bootstrap-ubuntu.sh substitutes it)
    deny all;
    auth_basic "Bucks operator console";
    auth_basic_user_file /etc/nginx/bucks-console.htpasswd;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;                      # must match --api-allowed-host
    proxy_set_header X-Forwarded-For $remote_addr;    # overwrite, never append: one client address
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization "";                # the basic-auth header is for nginx, not the node
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 30s;

    location = /api/auth/login {
        limit_req zone=bucks_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://bucks_node;
    }

    location /api/ {
        limit_req zone=bucks_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://bucks_node;
    }

    location / {
        proxy_pass http://bucks_node;
    }
}
